<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>GEQO Admin Dashboard</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icon-192.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind & Custom Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: '#3b82f6', secondary: '#1e40af', dark: '#0f172a' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/index.css">
    
    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="app" class="min-h-screen">
        <div v-if="loading" class="flex items-center justify-center min-h-screen">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
        </div>
        <template v-else>
            <!-- Handle Password Reset / Setup via URL link -->
            <ResetPassword v-if="resetToken" :token="resetToken" :is-setup="isSetup" @done="handlePasswordResetDone"></ResetPassword>
            
            <!-- Standard App Flow -->
            <template v-else>
                <Login v-if="!user" @login="handleLogin"></Login>
                <template v-else>
                    <ForcePasswordChange v-if="user.requires_password_change" :user="user" @updated="handleForcePasswordUpdated"></ForcePasswordChange>
                    <Dashboard v-else :user="user" @logout="handleLogout"></Dashboard>
                </template>
            </template>
        </template>
    </div>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
