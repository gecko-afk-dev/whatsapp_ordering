name: Backend Security & Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and Format with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Bandit (SAST)
        run: |
          bandit -r app/ -ll -c pyproject.toml || bandit -r app/ -ll

      - name: Run Safety (Dependency Check)
        run: |
          safety check -r requirements.txt || echo "Safety encountered issues, please review them."
