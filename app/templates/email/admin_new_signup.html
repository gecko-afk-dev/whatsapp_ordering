<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; color: #333; }
        .box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; background: #f9f9f9; }
        .item { margin-bottom: 10px; }
        .label { font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <h2>🚀 New Beta Signup Alert</h2>
    <div class="box">
        <div class="item"><span class="label">Restaurant Name:</span> $restaurant_name</div>
        <div class="item"><span class="label">Manager Name:</span> $manager_name</div>
        <div class="item"><span class="label">Email:</span> $email</div>
        <div class="item"><span class="label">WhatsApp Number:</span> $whatsapp_number</div>
        <div class="item"><span class="label">Card Code Redeemed:</span> $card_code</div>
    </div>
</body>
</html>
